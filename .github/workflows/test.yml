name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (feed parsers, models, health rules, open data)
        run: npm test
      - name: Syntax check of the browser scripts
        run: for f in public/*.js; do node --check "$f"; done
      - name: Model and result files are valid JSON
        run: for f in public/data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
