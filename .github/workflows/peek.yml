name: Peek track record
on:
  push:
    branches: [weather-research]
    paths: ['.github/workflows/peek.yml']
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 30 https://dashboardrunway.live/api/track-record | head -c 3000; echo; curl -s -o /dev/null -w "track.html %{http_code}\n" https://dashboardrunway.live/track.html
