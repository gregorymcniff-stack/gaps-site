name: Peek preview
on:
  push:
    branches: [weather-research]
    paths: ['.github/workflows/peek.yml']
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 https://deploy-preview-25--gaps-site.netlify.app/api/live > live.json
          node -e "const s=require('./live.json');const o=s.scores.outlook;console.log('PEEK', s.version, s.feeds.usHubWx.ok, s.feeds.usHubWx.error, o&&o.p3big, o&&o.typical, o&&JSON.stringify(o.features&&{c:o.features.capeNext6,h:o.features.usHubStressNext3,p:o.features.persist}), JSON.stringify(s.scores.scale))"
