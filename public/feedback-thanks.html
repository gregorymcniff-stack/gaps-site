<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a4a;--text:#334155;--muted:#5b6b7c;--border:#e2e8f0;--panel:#f8fbff}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.65}
header{background:var(--navy);color:#fff;padding:22px 16px}header .in,main{max-width:640px;margin:0 auto}header a{color:#93c5fd;text-decoration:none;font-size:13px}
header h1{margin:6px 0 4px;font-size:26px}header p{margin:0;color:#cbd5e1;font-size:14px}
main{padding:16px 16px 60px}p,li{font-size:14.5px}a{color:#1d4ed8}
label{display:block;font-weight:600;color:var(--navy);font-size:14px;margin:18px 0 6px}label span{font-weight:400;color:var(--muted)}
textarea,input,select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text)}
textarea{min-height:160px;resize:vertical}textarea:focus,input:focus,select:focus{outline:2px solid #93c5fd;border-color:#1d4ed8}
button{margin-top:22px;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 22px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}button:hover{background:#12406f}
.note{font-size:13px;color:var(--muted);margin-top:16px}.hp{position:absolute;left:-9999px}
.q{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:12px 0}.q ul{margin:4px 0;padding-left:20px}
</style>
<title>Thanks for the feedback</title>
<meta name="robots" content="noindex">
</head>
<body>
<header><div class="in"><a href="./">← Back to the dashboard</a><h1>Thank you</h1><p>Your feedback has been sent.</p></div></header>
<main>
<p>Thanks for taking the time. If you left an email address and asked a question, you'll get a reply.</p>
<p><a href="./">Back to the dashboard</a> · <a href="feedback.html">Send more feedback</a></p>
</main>
</body>
</html>
